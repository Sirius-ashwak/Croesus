packages:
  - "apps/*"
  - "packages/*"

# Skip the pre-run `pnpm install` deps check so `pnpm <script>` (e.g. `pnpm dev`) doesn't
# abort on the ignored-builds gate. bufferutil/keccak/utf-8-validate are optional native
# accelerators with pure-JS fallbacks, so not building them is fine.
verifyDepsBeforeRun: false

# Native build scripts we intentionally allow (Next's ESLint import resolver).
onlyBuiltDependencies:
  - unrs-resolver

# Optional native acceleration deps that have pure-JS fallbacks — intentionally NOT built.
ignoredBuiltDependencies:
  - bufferutil
  - keccak
  - utf-8-validate

# Explicit build-script decisions (pnpm 11+). Without booleans here, `pnpm install`
# under CI=true (e.g. Vercel) aborts with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  bufferutil: false
  keccak: false
  unrs-resolver: true
  utf-8-validate: false
